[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "courier-router"
version = "0.3.0"
description = "Courier route planner with CLI, authenticated web UI, Yandex Navigator deep-links and an optional Yandex Maps coordinate cross-check"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<0.29",
  "itsdangerous>=2.2,<3",
  "openpyxl==3.1.5",
  "ortools==9.15.6755",
  "pydantic>=2.12,<3",
  "Pillow>=11,<13",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
# Второй источник координат — Яндекс Карты через headless-браузер.
# После установки: python -m playwright install chromium
yandex = ["playwright>=1.40,<2"]

[project.scripts]
courier-route = "courier_router.cli:main"
courier-web = "courier_router.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
