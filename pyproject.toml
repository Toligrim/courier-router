[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "courier-router"
version = "0.1.0"
description = "CLI route planner for courier deliveries in Saint Petersburg and Leningrad Oblast"
requires-python = ">=3.13,<3.15"
dependencies = [
  "httpx>=0.28,<0.29",
  "openpyxl==3.1.5",
  "ortools==9.15.6755",
  "pydantic>=2.12,<3",
  "Pillow>=11,<13",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
courier-route = "courier_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
